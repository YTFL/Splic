[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "splic-composio"
version = "1.0.0"
description = "Splic Composio Integration Backend"
readme = "README.md"
requires-python = ">=3.11"

[tool.pyrefly]
project-includes = ["app", "tests"]
search-path = ["."]
python-interpreter-path = "/Library/Frameworks/Python.framework/Versions/3.11/bin/python3.11"
site-packages-path = ["/Library/Frameworks/Python.framework/Versions/3.11/lib/python3.11/site-packages"]
ignore-missing-imports = ["composio.*", "composio_core.*", "pytest.*"]

